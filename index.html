<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChiaraMail: email you can still change after you send it." />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fbfdfe" />
    <meta name="apple-mobile-web-app-title" content="ChiaraMail" />
    <title>ChiaraMail</title>
    <style>
      /* Start screen, only when opened as an installed app: the phone's own splash shows
         just the icon (Android 12+ allows nothing else), so this follows it with the name. */
      #splash { display: none; }
      @media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui) {
        #splash {
          position: fixed; inset: 0; z-index: 1000; background: #ffffff;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          transition: opacity 0.35s ease;
        }
      }
      #splash.splash-out { opacity: 0; pointer-events: none; }
      #splash img { width: 168px; height: 168px; }
      #splash .splash-name { font: 600 2.25rem/1 'Literata Variable', Georgia, 'Times New Roman', serif; color: #14313b; letter-spacing: -0.01em; }
      #splash .splash-name span { font-weight: 400; color: #587079; }
      #splash .splash-name sup { font-size: 0.4em; font-weight: 400; color: #587079; margin-left: 1px; }
      #splash .splash-tag { font: 1rem/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #587079; margin-top: -6px; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/icon-512.png" alt="" />
      <div class="splash-name">Chiara<span>Mail</span><sup>™</sup></div>
      <div class="splash-tag">Email you can change after sending</div>
    </div>
    <script>
      // Same language choice as the app: the one picked in ChiaraMail, else the phone's.
      (function () {
        var l = null;
        try { l = localStorage.getItem('chiaramail.lang'); } catch (e) { /* ignore */ }
        if (!l) l = ((navigator.languages || [navigator.language || 'en'])[0] || 'en').slice(0, 2);
        if (l === 'fr') document.querySelector('#splash .splash-tag').textContent = 'L’e-mail que l’on peut modifier après l’envoi';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
