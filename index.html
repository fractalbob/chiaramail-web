<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChiaraMail™ for Gmail: own the email you send, indefinitely. Correct or withdraw a message after sending, decide whether it can be forwarded, and keep a record of every change." />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fbfdfe" />
    <meta name="apple-mobile-web-app-title" content="ChiaraMail" />
    <title>ChiaraMail</title>
  </head>
  <body>
    <script>
      // No start screen of our own: the phone already shows the icon while the app loads, and
      // a second screen after it only flashed past. Safety net: a phone can wake a suspended or
      // half-loaded copy of the app; if the app hasn't started after 8 seconds, offer a reload.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.children.length) return;
        var l = null;
        try { l = localStorage.getItem('chiaramail.lang'); } catch (e) { /* ignore */ }
        if (!l) l = ((navigator.languages || [navigator.language || 'en'])[0] || 'en').slice(0, 2);
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = l === 'fr' ? 'ChiaraMail ne démarre pas. Toucher pour recharger.' : 'ChiaraMail didn’t start. Tap to reload.';
        b.style.cssText = 'display:block;margin:40vh auto 0;padding:12px 20px;border:1px solid #c9d6dc;border-radius:999px;background:#e9f0f4;color:#14313b;font:1rem system-ui,sans-serif';
        b.onclick = function () { location.reload(); };
        document.body.insertBefore(b, root);
      }, 8000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
